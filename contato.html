</div>
</footer>

</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { nome: '', empresa: '', whats: '', insta: '', msg: '', waLink: '', escolhas: {}, enviando: false, enviado: false, copiado: false };
  }
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.tc); }
  renderVals() {
    const st = this.state;
    const opcoes = ['Reels mensais', 'Filme de casamento', 'Cobertura de evento', 'Vídeo institucional', 'Gestão de anúncios', 'Ainda não sei'];
    const temEscolha = Object.keys(st.escolhas).some((k) => st.escolhas[k]);
    const passos = [st.nome.trim() !== '', st.whats.trim() !== '', temEscolha, st.msg.trim() !== ''];
    const feitos = passos.filter(Boolean).length;
    return {
      moveGlow: (e) => { try { const g = e.currentTarget.querySelector('.cy-cursor'); if (g) { g.style.transform = 'translate3d(' + (e.clientX - 200) + 'px,' + (e.clientY - 200) + 'px,0)'; if (!g.classList.contains('on')) g.classList.add('on'); } } catch (err) {} },
      setNome: (e) => this.setState({ nome: e.target.value }),
      setEmpresa: (e) => this.setState({ empresa: e.target.value }),
      setWhats: (e) => this.setState({ whats: e.target.value }),
      setMsg: (e) => this.setState({ msg: e.target.value }),
      setInsta: (e) => this.setState({ insta: e.target.value }),
      progresso: (feitos / 4 * 100) + '%',
      progressoTxt: feitos === 4 ? 'Tudo pronto!' : feitos + ' de 4 etapas',
      chips: opcoes.map((o) => {
        const on = !!st.escolhas[o];
        return {
          label: o, on: on, pressed: on ? 'true' : 'false',
          toggle: () => this.setState({ escolhas: { ...st.escolhas, [o]: !on } }),
          style: on ? 'background: #F4450F; color: #050505; border: 2px solid #F4450F; box-shadow: 0 10px 24px -10px rgba(244,69,15,0.9);' : 'background: #F3EFE9; color: #050505; border: 2px solid #DCD6CC;'
        };
      }),
      enviar: (e) => {
        e.preventDefault();
        if (st.enviando) return;
        const esc = Object.keys(st.escolhas).filter((k) => st.escolhas[k]);
        const linhas = ['Olá, Cynder! Vim pelo site.', '', '*Nome:* ' + st.nome.trim()];
        if (st.empresa.trim()) linhas.push('*Empresa:* ' + st.empresa.trim());
        if (st.whats.trim()) linhas.push('*WhatsApp:* ' + st.whats.trim());
        if (st.insta.trim()) linhas.push('*Instagram:* ' + st.insta.trim());
        if (esc.length) linhas.push('*Procuro:* ' + esc.join(', '));
        if (st.msg.trim()) linhas.push('', '*Objetivo:* ' + st.msg.trim());
        const link = 'https://wa.me/5554994270505?text=' + encodeURIComponent(linhas.join('\n'));
        this.setState({ enviando: true, waLink: link });
        try { window.open(link, '_blank', 'noopener'); } catch (err) {}
        this.t = setTimeout(() => this.setState({ enviando: false, enviado: true }), 700);
      },
      enviando: st.enviando, parado: !st.enviando,
      enviado: st.enviado, formulario: !st.enviado,
      novo: () => this.setState({ enviado: false, nome: '', empresa: '', whats: '', insta: '', msg: '', waLink: '', escolhas: {} }),
      waLink: st.waLink,
      copiar: () => {
        try { navigator.clipboard.writeText('+55 54 99427-0505'); } catch (err) {}
        this.setState({ copiado: true });
        clearTimeout(this.tc);
        this.tc = setTimeout(() => this.setState({ copiado: false }), 1800);
      },
      copiadoTxt: st.copiado ? 'COPIADO!' : 'COPIAR',
      copiadoFundo: st.copiado ? '#F4450F' : 'transparent',
      copiadoBorda: st.copiado ? '#F4450F' : '#DCD6CC'
    };
  }
}
</script>
<script src="/dcl.js"></script>

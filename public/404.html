      if (d > nL / 2) d -= nL;
      if (d < -nL / 2) d += nL;
      const ad = Math.abs(d), sg = Math.sign(d);
      const x = ad === 0 ? 0 : sg * (200 + (Math.min(ad, 6) - 1) * 125);
      const z = ad === 0 ? 80 : -110 - Math.min(ad, 6) * 70;
      const ry = ad === 0 ? 0 : -sg * Math.min(30 + ad * 6, 55);
      const sc = ad === 0 ? 1.12 : 1;
      const op = ad > 5 ? 0 : (ad === 0 ? 1 : 0.92 - ad * 0.13);
      const glow = ad === 0 ? 'box-shadow: 0 0 0 3px #F4450F, 0 30px 90px -10px rgba(244,69,15,0.85);' : 'box-shadow: 0 0 0 2px rgba(243,239,233,0.18), 0 20px 50px -20px rgba(0,0,0,0.9);';
      const filt = ad === 0 ? 'filter: none;' : 'filter: brightness(' + (0.85 - ad * 0.08).toFixed(2) + ') saturate(0.75);';
      return {
      moveGlow: (e) => { try { const g = e.currentTarget.querySelector('.cy-cursor'); if (g) { g.style.transform = 'translate3d(' + (e.clientX - 200) + 'px,' + (e.clientY - 200) + 'px,0)'; if (!g.classList.contains('on')) g.classList.add('on'); } } catch (err) {} },
        ...l,
        style: 'transform: translateX(' + x + 'px) translateZ(' + z + 'px) rotateY(' + ry + 'deg) scale(' + sc + '); opacity: ' + op.toFixed(2) + '; z-index: ' + (50 - ad) + '; pointer-events: ' + (ad > 5 ? 'none' : 'auto') + '; cursor: ' + (ad === 0 ? 'grab' : 'pointer') + ';' + glow + filt,
        go: () => { if (st.lmoved < 6) this.setState({ lc: st.lc + d }); }
      };
    });
    const gx = (ev) => (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);

    const inclui = [
      ['Gancho dos 3 primeiros segundos', 'Roteiro aprovado antes de gravar', 'Ideias alinhadas ao seu público'],
      ['Equipe e equipamentos de ponta', 'Direção de fala e postura', 'Imagens aéreas com drone'],
      ['Cortes no ritmo do vertical', 'Legenda na tela', 'Trilha e efeitos'],
      ['Capas e legendas atraentes', 'Calendário de postagens', 'Publicação programada'],
      ['Campanhas no Facebook e Instagram', 'Segmentação de público', 'Ajustes para maximizar resultado'],
      ['Eventos corporativos, sociais e culturais', 'Entrega rápida para as redes', 'Cobertura completa do evento'],
      ['Fotos de produtos e ambientes', 'Retratos da equipe e da marca', 'Fotos de eventos e casamentos']
    ];
    const base = [
      { t: 'Ideias e roteiros', d: 'Conceitos criativos e roteiros alinhados ao seu público e aos seus objetivos.' },
      { t: 'Produção de vídeos', d: 'Vídeos que destacam os pontos fortes da sua marca, produto ou serviço.' },
      { t: 'Edição de reels', d: 'Ritmo, cortes e legendas pensados para o formato vertical.' },
      { t: 'Gestão de postagens', d: 'Da capa e legenda ao gerenciamento das postagens nas redes sociais.' },
      { t: 'Tráfego pago', d: 'Campanhas otimizadas no Meta para visibilidade, engajamento e vendas.' },
      { t: 'Cobertura de eventos', d: 'Equipe especializada para registrar grandes eventos com agilidade e qualidade.' },
      { t: 'Fotografia', d: 'Também fotografamos quando você precisar: produtos, ambientes, equipe, eventos e casamentos.' }
    ];
    const servicos = base.map((s, i) => {
      const on = st.servico === i;
      return {
        n: String(i + 1), t: s.t, d: s.d, inclui: inclui[i], ativo: on, expanded: on ? 'true' : 'false',
        pick: () => this.setState({ servico: on ? -1 : i }),
        cardStyle: on ? 'background: #060505; color: #F3EFE9; border: 1px solid ' + accent + '; box-shadow: 0 0 0 4px rgba(244,69,15,0.18), 0 30px 60px -30px rgba(244,69,15,0.8);' : 'background: #FFFFFF; color: #050505; border: 1px solid #DCD6CC;',
        badgeStyle: on ? 'background: ' + accent + '; color: #050505; border: 3px solid ' + accent + ';' : 'background: transparent; color: #050505; border: 3px solid ' + accent + ';',
        plusStyle: on ? 'transform: rotate(45deg); color: #FF6A3D;' : 'transform: none; color: #050505;',
        textStyle: on ? 'color: #C9C4BC;' : 'color: #4A4744;'
      };
    });

    const etBase = [
      { n: '01', t: 'Briefing', d: 'Uma conversa para entender seu negócio, seu público e o que você quer alcançar. Cada negócio é único.' },
      { n: '02', t: 'Roteiro', d: 'Ideias e roteiros escritos pela nossa equipe e aprovados com você antes de qualquer gravação.' },
      { n: '03', t: 'REC', d: 'Gravação dirigida no seu espaço ou em locação, com equipamentos de ponta.' },
      { n: '04', t: 'Postagem', d: 'Edição, capa e legenda prontas. Publicamos e acompanhamos os resultados.' }
    ];
    const etapas = etBase.map((e, i) => {
      const on = st.etapa === i;
      return {
        ...e, ativo: on, selected: on ? 'true' : 'false',
        pick: () => this.setState({ etapa: i, auto: false }),
        tabStyle: on ? 'background: #050505; color: #F3EFE9;' : 'background: #F3EFE9; color: #050505;',
        numStyle: on ? 'color: #FF6A3D;' : 'color: #6B6660;'
      };
    });

    const reels = [0, 1, 2, 3].map((i) => ({ ...videos[i], cat2: videos[i].cat.toLowerCase(), open: () => this.setState({ aberto: i }) }));

    const equipe = [
      { nome: 'Gabriel Michaelsen', cargo: 'Sócio proprietário', img: '/assets/5fcbac5e53754a5f811578d90c181672.jpg' },
      { nome: 'Eduarda Seibt', cargo: 'Sócia proprietária', img: '/assets/fa802b7820246af265ad262cbd9e7136.jpg' },
      { nome: 'Claus Kny', cargo: 'Sócio proprietário', img: '/assets/ad54f636db6613d7f131072801f35da8.jpg' },
      { nome: 'Kelvin Blankenburg', cargo: 'Editor de vídeos', img: '/assets/5af3b9b29cd0866c88d3b0293c8584bb.jpg' },
      { nome: 'Danilo Barbosa', cargo: 'Filmmaker', img: '/assets/c76bdab6839727708a5de26449b42ced.jpg' },
      { nome: 'Rayssa Barbosa', cargo: 'Filmmaker e editora', img: '/assets/c3bb5af063d763328de7890c8cf3abfa.jpg' },
      { nome: 'Gilberto Kny', cargo: 'Financeiro', img: '/assets/d296cb950e6d068d8cc2414ec5478fd1.jpg' }
    ];

    const faqBase = [
      { p: 'Preciso saber falar para a câmera?', r: 'Não. Na gravação a gente orienta a fala e a postura e repete quantas vezes precisar até ficar natural.' },
      { p: 'Vocês cuidam da postagem e dos anúncios?', r: 'Sim. Criamos capas e legendas, gerenciamos as postagens e cuidamos do tráfego pago no Facebook e Instagram.' },
      { p: 'Fazem cobertura de eventos e casamentos?', r: 'Sim. Cobrimos eventos corporativos, sociais, esportivos e culturais, com entrega rápida. Casamentos têm uma página própria.' },
      { p: 'Como peço um orçamento?', r: 'É só chamar a gente no WhatsApp +55 54 99427-0505. Montamos uma proposta sob medida para o seu negócio.' }
    ];
    const faq = faqBase.map((q, i) => {
      const on = st.faq === i;
      return {
        ...q, on: on, expanded: on ? 'true' : 'false',
        toggle: () => this.setState({ faq: on ? -1 : i }),
        boxStyle: on ? 'background: #060505; border-color: #060505;' : 'background: #FFFFFF;',
        titleStyle: on ? 'color: #F3EFE9;' : 'color: #050505;',
        iconStyle: on ? 'background: ' + accent + '; color: #050505; transform: rotate(45deg);' : 'background: #F3EFE9; color: #050505; transform: none;'
      };
    });

    const palavras = ['REELS', 'ROTEIRO', 'GRAVAÇÃO', 'EDIÇÃO', 'TRÁFEGO PAGO', 'EVENTOS', 'DRONE', 'POSTAGEM'];
    const brasas = Array.from({ length: 14 }, (_, k) => ({ x: ((k * 37) % 100) + '%', d: ((k * 0.7) % 6).toFixed(1) + 's', t: (5 + (k % 4)) + 's' }));
    const faiscas = st.faiscas.map((s) => ({
      style: 'transform: translate(' + (s.fly ? s.dx : 0) + 'px, ' + (s.fly ? s.dy : 0) + 'px) scale(' + (s.fly ? 0.2 : s.size) + '); opacity: ' + (s.fly ? 0 : 1) + '; background: ' + (s.size > 1 ? '#FF6A3D' : accent) + ';'
    }));
    return {
      accent: accent,
      zap: 'https://wa.me/5554994270505?text=Ol%C3%A1%2C%20Cynder!%20Quero%20chamar%20um%20or%C3%A7amento.',
      onHeroMove: (ev) => {
        const r = ev.currentTarget.getBoundingClientRect();
        const next = { mx: ((ev.clientX - r.left) / r.width) * 100, my: ((ev.clientY - r.top) / r.height) * 100, hover: true };
        if (st.drag) { const dx = ev.clientX - st.lastX; next.rot = st.rot + dx * 0.35; next.lastX = ev.clientX; next.moved = st.moved + Math.abs(dx); }
        this.setState(next);
      },
      onHeroLeave: () => this.setState({ hover: false, drag: false }),
      startDrag: (ev) => this.setState({ drag: true, lastX: ev.clientX, moved: 0 }),
      endDrag: () => this.setState({ drag: false }),
      cursor: st.drag ? 'grabbing' : 'grab',
      stageTransform: 'rotateX(' + tiltX.toFixed(1) + 'deg) rotateY(' + st.rot.toFixed(1) + 'deg)',
      heroGlow: 'opacity: ' + (st.hover ? 1 : 0.6) + '; background: radial-gradient(560px circle at ' + st.mx.toFixed(1) + '% ' + st.my.toFixed(1) + '%, rgba(244,69,15,0.24), rgba(244,69,15,0) 70%);',
      brasas: brasas,
      anel: anel,
      forcePlay: (e) => { try { e.target.muted = true; const p = e.target.play(); if (p && p.catch) p.catch(() => {}); } catch (err) {} },
      grabReel: (e) => { this.reelEl = e.target; try { if (!st.playing) { e.target.muted = true; const p = e.target.play(); if (p && p.catch) p.catch(() => {}); } } catch (err) {} },
      playing: st.playing, paused: !st.playing,
      togglePlay: () => {
        const el = this.reelEl;
        if (el) { try { el.muted = true; if (!st.playing) { el.currentTime = 0; el.play(); } } catch (err) {} }
        this.setState({ playing: !st.playing });
      },
      reelFilter: st.playing ? 'filter: none;' : 'filter: brightness(0.55) saturate(0.8);',
      reelVeil: st.playing ? 'rgba(6,5,5,0)' : 'rgba(6,5,5,0.35)',
      reelBorder: st.playing ? accent : '#2A2826',
      reelShadow: st.playing ? '0 0 0 4px rgba(244,69,15,0.2), 0 40px 120px -40px rgba(244,69,15,0.7)' : 'none',
      faixa: palavras.concat(palavras),
      navItens: [['Início', '#topo'], ['Serviços', '#servicos'], ['Trabalhos', '/trabalhos'], ['Casamentos', '/casamentos'], ['Sobre', '/sobre'], ['Contato', '/contato']].map(([t, h]) => ({
        t: t, href: h, cls: 'cy-navp' + (st.nav === t ? ' on' : ''),
        go: (ev) => {
          if (h.charAt(0) === '#') {
            try { ev.preventDefault(); const el = ev.currentTarget.ownerDocument.getElementById(h.slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
          }
          this.setState({ nav: t });
        }
      })),
      cidades: [['Nova Petrópolis', 300, 270, true], ['Gramado', 300, 152], ['Picada Café', 430, 211], ['Caxias do Sul', 430, 329], ['Feliz', 300, 388], ['Santa Maria do Herval', 170, 329], ['Linha Nova', 170, 211], ['Canela', 381, 61], ['Bento Gonçalves', 504, 159], ['Farroupilha', 532, 309], ['Vale Real', 452, 440], ['São Vendelino', 300, 492], ['Bom Princípio', 148, 440], ['Ivoti', 68, 309], ['Dois Irmãos', 96, 159], ['Morro Reuter', 219, 61]].map(([nome, x, y, base]) => {
        const on = st.cidade === nome;
        const q = encodeURIComponent(nome + ', RS');
        return {
          nome: nome, x: (x / 600 * 100).toFixed(2) + '%', y: (y / 540 * 100).toFixed(2) + '%', z: on ? 5 : 2,
          on: on, aberto: on ? 'true' : 'false',
          cls: 'cy-pin' + (base ? ' base' : '') + (on ? ' on' : ''),
          gmaps: 'https://www.google.com/maps/search/?api=1&query=' + q,
          waze: 'https://waze.com/ul?q=' + q + '&navigate=yes',
          toggle: () => this.setState({ cidade: on ? '' : nome })
        };
      }),
      cf: cf,
      nMarcas: nL,
      lNome: logos[lc].nome,
      lConta: String(lc + 1).padStart(2, '0') + ' / ' + nL + ' MARCAS ATENDIDAS',
      lPrev: () => this.setState({ lc: st.lc - 1 }),
      lNext: () => this.setState({ lc: st.lc + 1 }),
      lCursor: st.ldrag ? 'grabbing' : 'grab',
      lDown: (ev) => this.setState({ ldrag: true, lx: gx(ev), lacc: 0, lmoved: 0, lhover: true }),
      lMove: (ev) => {
        if (!st.ldrag) { if (!st.lhover) this.setState({ lhover: true }); return; }
        const x = gx(ev); if (x == null) return;
        let acc = st.lacc + (x - st.lx); let c = st.lc;
        while (acc <= -110) { c += 1; acc += 110; }
        while (acc >= 110) { c -= 1; acc -= 110; }
        this.setState({ lx: x, lacc: acc, lc: c, lmoved: st.lmoved + Math.abs(x - st.lx) });
      },
      lUp: () => this.setState({ ldrag: false }),
      lLeave: () => this.setState({ ldrag: false, lhover: false }),
      servicos: servicos,
      etapas: etapas,
      etapaAtual: etBase[st.etapa],
      reels: reels,
      equipe: equipe,
      faq: faq,
      aberto: idx >= 0,
      atual: idx >= 0 ? videos[idx] : videos[0],
      fechar: () => this.setState({ aberto: -1 }),
      proximo: () => this.setState({ aberto: (idx + 1) % nV }),
      anterior: () => this.setState({ aberto: (idx - 1 + nV) % nV }),
      acender: () => this.acender(),
      faiscas: faiscas,
      chamaStyle: st.lit ? 'background: #050505; box-shadow: 0 0 0 10px rgba(5,5,5,0.12), 0 0 80px 10px rgba(255,106,61,0.9);' : 'background: rgba(5,5,5,0.9); box-shadow: 0 0 0 10px rgba(5,5,5,0.08);',
      chamaImg: st.lit ? 'filter: drop-shadow(0 0 18px #FF6A3D) brightness(1.15);' : 'filter: grayscale(0.4) brightness(0.8);',
      lit: st.lit,
      chamaLabel: st.lit ? (st.disparos > 1 ? 'MAIS FAÍSCA!' : 'ACESO! CLIQUE DE NOVO') : 'CLIQUE PARA ACENDER'
    };
  }
}
</script>
<script src="/dcl.js"></script>

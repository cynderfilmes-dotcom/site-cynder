<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { foto: 0, momentos: { 'Cerimônia': true, 'Festa': true }, pulse: false, passo: 0, coracoes: [] };
  }
  componentWillUnmount() { clearTimeout(this.tp); clearTimeout(this.th); }
  renderVals() {
    const st = this.state;
    const B = '';
    const fotosBase = [
      { img: '/assets/563ca4bdf93b44ff8c1188a6f4071d34.jpg', t: 'Cerimônia', alt: 'Noivos abraçados sob o véu ao pôr do sol' },
      { img: '/assets/8258975d259e275638224f7972f3f6c0.jpg', t: 'Ângela e Andersson', alt: 'Noiva com buquê na beira do lago ao pôr do sol' },
      { img: '/assets/ebc862d1f834f3e6b630a0db79f71387.jpg', t: 'Ana e Lorenzo', alt: 'Noiva com buquê no casamento de Ana e Lorenzo' }
    ];
    const nF = fotosBase.length;
    const fotos = fotosBase.map((f, i) => {
      const pos = (i - st.foto + nF) % nF;
      const rot = [0, 6, -6][pos];
      const dx = [0, 28, -28][pos];
      return {
      moveGlow: (e) => { try { const g = e.currentTarget.querySelector('.cy-cursor'); if (g) { g.style.transform = 'translate3d(' + (e.clientX - 200) + 'px,' + (e.clientY - 200) + 'px,0)'; if (!g.classList.contains('on')) g.classList.add('on'); } } catch (err) {} },
        ...f,
        style: 'z-index: ' + (10 - pos) + '; transform: translateX(' + dx + 'px) rotate(' + rot + 'deg) scale(' + (pos === 0 ? 1 : 0.94) + '); box-shadow: ' + (pos === 0 ? '0 40px 80px -30px rgba(244,69,15,0.7)' : '0 20px 40px -20px rgba(0,0,0,0.6)') + '; opacity: ' + (pos === 0 ? 1 : 0.75) + ';'
      };
    });
    const opcoes = ['Pedido de casamento', 'Making of', 'Cerimônia', 'Festa', 'Imagens de drone', 'Teaser para Instagram', 'Filme completo', 'Entrevista com os noivos'];
    const momentos = opcoes.map((o) => {
      const on = !!st.momentos[o];
      return {
        label: o, on: on, pressed: on ? 'true' : 'false',
        toggle: () => {
          this.setState({ momentos: { ...st.momentos, [o]: !on }, pulse: true });
          clearTimeout(this.tp);
          this.tp = setTimeout(() => this.setState({ pulse: false }), 260);
        },
        style: on ? 'background: #F4450F; color: #050505; border: 2px solid #F4450F; box-shadow: 0 10px 24px -10px rgba(244,69,15,0.9);' : 'background: #FFFFFF; color: #050505; border: 2px solid #DCD6CC;'
      };
    });
    const escolhidos = opcoes.filter((o) => st.momentos[o]);
    const qtd = escolhidos.length;
    const msg = 'Olá, Cynder! Vou casar e quero um orçamento de filme de casamento.' + (qtd ? ' Momentos: ' + escolhidos.join(', ') + '.' : '');
    const passosBase = [
      { n: '01', t: 'Conversa', d: 'A gente conhece vocês, a história do casal e o estilo do casamento.' },
      { n: '02', t: 'Planejamento', d: 'Definimos os momentos, os locais e as tomadas de drone.' },
      { n: '03', t: 'O grande dia', d: 'Nossa equipe registra tudo com discrição, do making of à festa.' },
      { n: '04', t: 'Entrega', d: 'Teaser para as redes e o filme completo, editado com emoção.' }
    ];
    const passos = passosBase.map((p, i) => {
      const on = st.passo === i;
      return {
        ...p, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ passo: i }),
        style: on ? 'background: #060505; color: #F3EFE9; border: 1px solid #F4450F; box-shadow: 0 30px 60px -30px rgba(244,69,15,0.8);' : 'background: #FFFFFF; color: #050505; border: 1px solid #DCD6CC;',
        numStyle: on ? 'color: #F4450F;' : 'color: #F2D6CA;',
        textStyle: on ? 'color: #C9C4BC;' : 'color: #4A4744;'
      };
    });
    return {
      zap: 'https://wa.me/5554994270505?text=' + encodeURIComponent('Olá, Cynder! Quero um orçamento de filme de casamento.'),
      zapLista: 'https://wa.me/5554994270505?text=' + encodeURIComponent(msg),
      fotos: fotos,
      fotoAtual: fotosBase[st.foto],
      coracoes: st.coracoes,
      proximaFoto: () => {
        const hs = [0, 1, 2].map((k) => ({ id: Date.now() + k, x: ((k - 1) * 60 + Math.round(Math.random() * 30 - 15)) + 'px' }));
        this.setState({ foto: (st.foto + 1) % nF, coracoes: hs });
        clearTimeout(this.th);
        this.th = setTimeout(() => this.setState({ coracoes: [] }), 1500);
      },
      momentos: momentos,
      qtdMomentos: String(qtd),
      momentosTxt: qtd === 0 ? 'Escolha os momentos do seu filme.' : (qtd === 1 ? 'momento escolhido.' : 'momentos escolhidos para o seu filme.'),
      contadorPulse: st.pulse ? 'scale(1.35)' : 'scale(1)',
      filmes: [
        { t: 'Cerimônia', d: 'Filme de casamento · Ângela e Andersson', img: '/assets/563ca4bdf93b44ff8c1188a6f4071d34.jpg', link: 'https://www.instagram.com/reel/DQE5Q26jbYK/' },
        { t: 'Ângela e Andersson', d: 'Imagens aéreas ao pôr do sol', img: '/assets/8258975d259e275638224f7972f3f6c0.jpg', link: 'https://www.instagram.com/reel/DQpggguiYQK/' },
        { t: 'Ana e Lorenzo', d: 'Filme de casamento', img: '/assets/ebc862d1f834f3e6b630a0db79f71387.jpg', link: 'https://www.instagram.com/reel/DP4LN7iDiXZHVzpOQYZM1HSWTR2xiuFs5TA0fE0/' }
      ],
      passos: passos
    };
  }
}

<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A4744">Ao tocar em enviar, o formulário abre o WhatsApp com a sua mensagem pronta para a Cynder. O envio é feito por você, pelo seu próprio WhatsApp, e a conversa fica registrada no WhatsApp das duas partes. Os botões de WhatsApp, Instagram, Google Maps e Waze levam para esses serviços, que têm as próprias políticas de privacidade.</p>
